# CI on every push:
#   tests        offline unit/integration suite on Linux, macOS, Windows x Python 3.9/3.12/3.13/3.14
#   fresh-start  what a grader does: one command on a clean machine (run.sh, or run.ps1 on
#                Windows), /health within 60 s, then / and the brief's three examples;
#                Python 3.9 and 3.14 on each OS
#   browsers     end-to-end UI tests in Chromium, Firefox and WebKit on Linux, macOS, Windows
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite (network blocked inside the tests)
        run: python -m pytest -q -p no:warnings --junitxml=junit.xml
      - name: Test report (traceability, catalogue, metrics)
        if: always()
        run: python scripts/test_report.py --junit junit.xml --summary >> "$GITHUB_STEP_SUMMARY"

  fresh-start:
    # One process starts the documented launcher and checks it (scripts/smoke_start.py).
    # It must be one step: Windows runners kill a step's processes when the step ends.
    name: Fresh clone starts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Start with run.sh / run.ps1, wait for /health (60 s), check / and the brief examples
        run: python scripts/smoke_start.py --timeout 60
      - name: Server log
        if: always()
        shell: bash
        run: cat server.log 2>/dev/null || echo "(no server.log)"

  browsers:
    name: Browser tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app, Playwright and axe-core
        run: python -m pip install -r requirements-e2e.txt
      - name: Install Chromium, Firefox and WebKit
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end tests in all three engines
        run: python -m pytest e2e -q -p no:warnings --junitxml=e2e.xml
      - name: Browser test report
        if: always()
        run: python scripts/test_report.py --e2e-junit e2e.xml --summary-e2e >> "$GITHUB_STEP_SUMMARY"
